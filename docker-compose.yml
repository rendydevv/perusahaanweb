version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: rsmtech-web:latest
    container_name: rsmtech-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.rsmtech.description=RSM Technologies Landing Page"
      - "com.rsmtech.version=1.0.0"

  # Development service (optional â€” for hot reload dev environment)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rsmtech-web-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
